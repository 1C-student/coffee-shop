<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кофейня "Теплый Зерновой" - Корзина</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="logo" href="index.html">Теплый Зерновой</a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="menu.html">Меню</a>
        <a href="cart.html">Корзина <span id="cart-count-badge">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <h1>Корзина</h1>
    <div class="cart-layout">
      <section class="panel">
        <ul id="cart-items"></ul>
        <p id="cart-empty">Корзина пока пуста.</p>
        <p><strong>Итого:</strong> <span id="cart-total">0</span> ₽</p>
        <div class="promo-row">
          <input id="promo-code" type="text" placeholder="Промокод (например COFFEE10)">
          <button id="apply-promo" class="btn-secondary" type="button">Применить</button>
        </div>
        <p id="discount-line" class="muted"></p>
        <div class="card-actions">
          <button id="clear-cart" class="clear-btn" type="button">Очистить корзину</button>
          <button id="export-cart" class="btn-secondary" type="button">Скачать чек</button>
        </div>
      </section>
      <section class="panel">
        <h2>Оформить заказ</h2>
        <form id="checkout-form" class="checkout-form">
          <input id="customer-name" type="text" placeholder="Ваше имя" required>
          <input id="customer-phone" type="tel" placeholder="Телефон" required>
          <textarea id="customer-comment" placeholder="Комментарий"></textarea>
          <button class="order-btn" type="submit">Оформить и скачать чек</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Автор: Озерова Елизавета Павловна</p>
    </div>
  </footer>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="cart.js"></script>
</body>
</html>
